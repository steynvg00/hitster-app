<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Kleurt de iOS-statusbalk/browserchrome in de plum-top van de
		     paginagradient (--color-mixup-deep-violet), zodat er geen zwarte
		     band boven of onder de app blijft staan. -->
		<meta name="theme-color" content="#221546" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- M!XUP redesign fonts: Barlow Condensed 900 (display), Rubik 500-800 (UI),
		     JetBrains Mono (labels/eyebrows). Tokens: --font-display / --font-ui / --font-data. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Rubik:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
